<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; }
        .chart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
        .chart-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
        .chart-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #666; }
        .chart-container { height: 200px; position: relative; }
        #log { margin-top: 20px; padding: 10px; background: #f0f0f0; font-family: monospace; font-size: 12px; }
        .log-entry { margin: 5px 0; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard Chart Test</h1>
        <button id="test-btn" onclick="testDashboard()">Load Dashboard</button>
        <button onclick="clearLog()">Clear Log</button>

        <div id="log"></div>

        <div class="chart-grid">
            <div class="chart-card">
                <h3>Status Distribution</h3>
                <div class="chart-container">
                    <canvas id="status-pie-chart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3>Channel Performance</h3>
                <div class="chart-container">
                    <canvas id="channel-bar-chart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3>Notification Types</h3>
                <div class="chart-container">
                    <canvas id="type-doughnut-chart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3>Priority Levels</h3>
                <div class="chart-container">
                    <canvas id="priority-bar-chart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        let dashboardCharts = {
            statusPie: null,
            channelBar: null,
            typeDoughnut: null,
            priorityBar: null
        };

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            console.log(message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function generateColors(count, alpha = 1) {
            const colors = [
                `rgba(37, 99, 235, ${alpha})`,
                `rgba(16, 185, 129, ${alpha})`,
                `rgba(239, 68, 68, ${alpha})`,
                `rgba(245, 158, 11, ${alpha})`,
                `rgba(124, 58, 237, ${alpha})`,
            ];
            const result = [];
            for (let i = 0; i < count; i++) {
                result.push(colors[i % colors.length]);
            }
            return result;
        }

        function renderStatusPieChart(data) {
            try {
                log('Rendering status pie chart...', 'info');
                if (dashboardCharts.statusPie) dashboardCharts.statusPie.destroy();

                const canvas = document.getElementById('status-pie-chart');
                if (!canvas) {
                    log('ERROR: Canvas element status-pie-chart not found', 'error');
                    return;
                }

                const ctx = canvas.getContext('2d');
                dashboardCharts.statusPie = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: data.map(item => item._id || 'Unknown'),
                        datasets: [{
                            data: data.map(item => item.count),
                            backgroundColor: generateColors(data.length, 0.8),
                            borderColor: generateColors(data.length, 1),
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
                log('✓ Status pie chart rendered successfully', 'success');
            } catch (error) {
                log('ERROR rendering status pie chart: ' + error.message, 'error');
            }
        }

        function renderChannelBarChart(data) {
            try {
                log('Rendering channel bar chart...', 'info');
                if (dashboardCharts.channelBar) dashboardCharts.channelBar.destroy();

                const canvas = document.getElementById('channel-bar-chart');
                if (!canvas) {
                    log('ERROR: Canvas element channel-bar-chart not found', 'error');
                    return;
                }

                const ctx = canvas.getContext('2d');
                dashboardCharts.channelBar = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.map(item => item._id || 'Unknown'),
                        datasets: [{
                            label: 'Count',
                            data: data.map(item => item.count),
                            backgroundColor: generateColors(data.length, 0.7),
                            borderColor: generateColors(data.length, 1),
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
                log('✓ Channel bar chart rendered successfully', 'success');
            } catch (error) {
                log('ERROR rendering channel bar chart: ' + error.message, 'error');
            }
        }

        function renderTypeDoughnutChart(data) {
            try {
                log('Rendering type doughnut chart...', 'info');
                if (dashboardCharts.typeDoughnut) dashboardCharts.typeDoughnut.destroy();

                const canvas = document.getElementById('type-doughnut-chart');
                if (!canvas) {
                    log('ERROR: Canvas element type-doughnut-chart not found', 'error');
                    return;
                }

                const ctx = canvas.getContext('2d');
                dashboardCharts.typeDoughnut = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: data.map(item => item._id || 'Unknown'),
                        datasets: [{
                            data: data.map(item => item.count),
                            backgroundColor: generateColors(data.length, 0.8),
                            borderColor: generateColors(data.length, 1),
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
                log('✓ Type doughnut chart rendered successfully', 'success');
            } catch (error) {
                log('ERROR rendering type doughnut chart: ' + error.message, 'error');
            }
        }

        function renderPriorityBarChart(data) {
            try {
                log('Rendering priority bar chart...', 'info');
                if (dashboardCharts.priorityBar) dashboardCharts.priorityBar.destroy();

                const canvas = document.getElementById('priority-bar-chart');
                if (!canvas) {
                    log('ERROR: Canvas element priority-bar-chart not found', 'error');
                    return;
                }

                const ctx = canvas.getContext('2d');
                dashboardCharts.priorityBar = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.map(item => `Priority ${item._id}`),
                        datasets: [{
                            label: 'Count',
                            data: data.map(item => item.count),
                            backgroundColor: 'rgba(124, 58, 237, 0.7)',
                            borderColor: 'rgba(124, 58, 237, 1)',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
                log('✓ Priority bar chart rendered successfully', 'success');
            } catch (error) {
                log('ERROR rendering priority bar chart: ' + error.message, 'error');
            }
        }

        async function testDashboard() {
            clearLog();

            // Check Chart.js
            if (typeof Chart === 'undefined') {
                log('ERROR: Chart.js library not loaded!', 'error');
                return;
            }
            log('✓ Chart.js version: ' + Chart.version, 'success');

            // Check canvas elements
            const canvases = ['status-pie-chart', 'channel-bar-chart', 'type-doughnut-chart', 'priority-bar-chart'];
            canvases.forEach(id => {
                const canvas = document.getElementById(id);
                if (canvas) {
                    log(`✓ Canvas element '${id}' found`, 'success');
                } else {
                    log(`ERROR: Canvas element '${id}' NOT found`, 'error');
                }
            });

            // Fetch dashboard data
            try {
                log('Fetching dashboard data from API...', 'info');
                const response = await fetch('/api/v2/dashboard');

                if (!response.ok) {
                    log(`ERROR: HTTP ${response.status} - ${response.statusText}`, 'error');
                    return;
                }

                const data = await response.json();
                log('✓ Dashboard data received', 'success');
                log(`  - Status distribution: ${data.status_distribution?.length || 0} items`, 'info');
                log(`  - Channel performance: ${data.channel_performance?.length || 0} items`, 'info');
                log(`  - Notification types: ${data.notification_types?.length || 0} items`, 'info');
                log(`  - Priority distribution: ${data.priority_distribution?.length || 0} items`, 'info');

                // Render charts
                if (data.status_distribution && data.status_distribution.length > 0) {
                    renderStatusPieChart(data.status_distribution);
                }
                if (data.channel_performance && data.channel_performance.length > 0) {
                    renderChannelBarChart(data.channel_performance);
                }
                if (data.notification_types && data.notification_types.length > 0) {
                    renderTypeDoughnutChart(data.notification_types);
                }
                if (data.priority_distribution && data.priority_distribution.length > 0) {
                    renderPriorityBarChart(data.priority_distribution);
                }

                log('✓ Dashboard test completed!', 'success');
            } catch (error) {
                log('ERROR fetching dashboard data: ' + error.message, 'error');
            }
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                log('Page loaded, running auto-test...', 'info');
                testDashboard();
            }, 500);
        });
    </script>
</body>
</html>
